name: Build and Deploy to Coolify

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build Docker Image and Push to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate lowercase image tag
        id: image_tag
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          echo "image=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "Target Image Tag: ${IMAGE_NAME}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.image_tag.outputs.image }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL || 'https://eyewear-be.ngocthang.io.vn' }}
            VITE_ADDRESS_API_URL=${{ secrets.VITE_ADDRESS_API_URL || 'https://province-api-deploy-v1.vercel.app' }}
            VITE_APP_NAME=Eyewear Shop
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify Webhook
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::error ::COOLIFY_WEBHOOK_URL or COOLIFY_TOKEN is missing."
            exit 1
          fi

          echo "Triggering Coolify deployment..."
          curl --fail-with-body \
            --request POST "$COOLIFY_WEBHOOK_URL" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"

          echo "Coolify deployment triggered successfully!"
