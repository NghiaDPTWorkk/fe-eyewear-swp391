name: Build and Deploy to Coolify

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build Docker Image and Push to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate lowercase image tag
        id: image_tag
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          echo "image=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "Target Image Tag: ${IMAGE_NAME}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.image_tag.outputs.image }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL || 'https://eyewear-be.ngocthang.io.vn' }}
            VITE_APP_NAME=Eyewear Shop
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify Webhook
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ]; then
            echo "::warning ::COOLIFY_WEBHOOK_URL is not set yet. Skipping webhook trigger."
            echo "Once you configure the resource on Coolify, add COOLIFY_WEBHOOK_URL to GitHub Secrets."
          else
            echo "Triggering Coolify deployment..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET "$COOLIFY_WEBHOOK_URL" || curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$COOLIFY_WEBHOOK_URL")
            echo "$RESPONSE"
            echo "Coolify deployment triggered successfully!"
          fi
